<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Consulta — MediSystem</title>
  <link rel="stylesheet" href="../styles/index.style.css">
  <link rel="stylesheet" href="../styles/form.style.css">
</head>
<body>
  <header>
    <div class="logo">🏥 MediSystem</div>
    <nav>
  <a href="../index.html">Inicio</a>
  <a href="../dashboard.html">Dashboard</a>
  <a href="../pacientes.html">Pacientes</a>
  <a href="createConsulta.html" class="active">Nova Consulta</a>
</nav>
  </header>

  <main>
    <div class="form-container">
      <div class="form-header">
        <a href="../index.html" class="voltar">← Voltar</a>
        <h1>Nova Consulta</h1>
        <p>Preencha os dados para agendar uma nova consulta médica</p>
      </div>

      <div id="mensagem" class="mensagem oculto"></div>

      <div class="form-card">
        <div class="campo">
          <label for="paciente">👤 Paciente *</label>
          <input type="text" id="paciente" placeholder="Nome completo do paciente">
        </div>

        <div class="campo">
          <label for="medico">🩺 Medico *</label>
          <select id="medico">
            <option value="">Carregando medicos...</option>
          </select>
        </div>

        <div class="campo">
          <label for="especialidade">🏥 Especialidade</label>
          <input type="text" id="especialidade" placeholder="Ex: Cardiologia, Clinica Geral..." readonly>
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="data">📅 Data *</label>
            <input type="date" id="data">
          </div>
          <div class="campo">
            <label for="hora">🕐 Hora</label>
            <input type="time" id="hora">
          </div>
        </div>

        <div class="campo">
          <label for="descricao">📝 Descrição</label>
          <textarea id="descricao" rows="3" placeholder="Motivo da consulta, observacoes..."></textarea>
        </div>

        <div class="campo">
          <label for="status">📌 Status</label>
          <select id="status">
            <option value="agendada">Agendada</option>
            <option value="realizada">Realizada</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </div>

        <div class="form-actions">
          <a href="../index.html" class="btn-cancelar">Cancelar</a>
          <button onclick="criar()" class="btn-primary">✅ Salvar Consulta</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    let medicos = [];

    // Carrega a lista de médicos do banco ao abrir a página
    async function carregarMedicos() {
      const select = document.getElementById('medico');
      try {
        const res = await fetch('http://localhost:8080/medicos');
        medicos = await res.json();

        if (!medicos || medicos.length === 0) {
          select.innerHTML = '<option value="">Nenhum medico cadastrado</option>';
          return;
        }

        select.innerHTML = '<option value="">Selecione um medico...</option>' +
          medicos.map(m => `<option value="${m.nome}">${m.nome}${m.especialidade ? ' — ' + m.especialidade : ''}</option>`).join('');

        // Ao selecionar médico, preenche especialidade automaticamente
        select.addEventListener('change', () => {
          const selecionado = medicos.find(m => m.nome === select.value);
          document.getElementById('especialidade').value = selecionado?.especialidade || '';
        });

      } catch (e) {
        select.innerHTML = '<option value="">Erro ao carregar medicos</option>';
      }
    }

    async function criar() {
      const paciente = document.getElementById('paciente').value.trim();
      const medico = document.getElementById('medico').value.trim();
      const data = document.getElementById('data').value;

      if (!paciente || !medico || !data) {
        mostrarMensagem('Preencha os campos obrigatorios: Paciente, Medico e Data.', 'erro');
        return;
      }

      const body = {
        paciente,
        medico,
        especialidade: document.getElementById('especialidade').value.trim(),
        data,
        hora: document.getElementById('hora').value || '00:00',
        descricao: document.getElementById('descricao').value.trim(),
        status: document.getElementById('status').value,
      };

      try {
        const res = await fetch('http://localhost:8080/consultas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        if (res.ok) {
          mostrarMensagem('Consulta criada com sucesso! Redirecionando...', 'sucesso');
          setTimeout(() => window.location.href = '../index.html', 1500);
        } else {
          const erro = await res.json();
          mostrarMensagem('Erro: ' + erro.erro, 'erro');
        }
      } catch (e) {
        mostrarMensagem('Erro ao conectar com o servidor.', 'erro');
      }
    }

    function mostrarMensagem(texto, tipo) {
      const el = document.getElementById('mensagem');
      el.textContent = texto;
      el.className = `mensagem ${tipo}`;
    }

    carregarMedicos();
  </script>
</body>
</html>
