<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Paciente — MediSystem</title>
  <link rel="stylesheet" href="../styles/index.style.css">
  <link rel="stylesheet" href="../styles/form.style.css">
</head>
<body>
  <header>
    <div class="logo">🏥 MediSystem</div>
    <nav>
      <a href="../index.html">Consultas</a>
      <a href="../dashboard.html">Dashboard</a>
      <a href="../pacientes.html" class="active">Pacientes</a>
      <a href="createConsulta.html">Nova Consulta</a>
    </nav>
  </header>

  <main>
    <div class="form-container">
      <div class="form-header">
        <a href="../pacientes.html" class="voltar">← Voltar</a>
        <h1>Novo Paciente</h1>
        <p>Preencha os dados para cadastrar um paciente</p>
      </div>

      <div id="mensagem" class="mensagem oculto"></div>

      <div class="form-card">
        <div class="campo">
          <label for="nome">👤 Nome completo *</label>
          <input type="text" id="nome" placeholder="Nome completo do paciente">
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="cpf">🪪 CPF *</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)">
          </div>
          <div class="campo">
            <label for="dataNascimento">🎂 Data de Nascimento</label>
            <input type="date" id="dataNascimento">
          </div>
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="telefone">📞 Telefone</label>
            <input type="text" id="telefone" placeholder="(00) 00000-0000" maxlength="15" oninput="mascaraTelefone(this)">
          </div>
          <div class="campo">
            <label for="email">✉️ Email</label>
            <input type="email" id="email" placeholder="email@exemplo.com">
          </div>
        </div>

        <div class="campo">
          <label for="endereco">📍 Endereço</label>
          <input type="text" id="endereco" placeholder="Rua, número, bairro, cidade">
        </div>

        <div class="form-actions">
          <a href="../pacientes.html" class="btn-cancelar">Cancelar</a>
          <button onclick="criar()" class="btn-primary">✅ Salvar Paciente</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API = 'http://localhost:8080';

    function mascaraCPF(input) {
      let v = input.value.replace(/\D/g, '').substring(0, 11);
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      input.value = v;
    }

    function mascaraTelefone(input) {
      let v = input.value.replace(/\D/g, '').substring(0, 11);
      if (v.length <= 10) {
        v = v.replace(/(\d{2})(\d)/, '($1) $2');
        v = v.replace(/(\d{4})(\d)/, '$1-$2');
      } else {
        v = v.replace(/(\d{2})(\d)/, '($1) $2');
        v = v.replace(/(\d{5})(\d)/, '$1-$2');
      }
      input.value = v;
    }

    async function criar() {
      const nome = document.getElementById('nome').value.trim();
      const cpf  = document.getElementById('cpf').value.trim();

      if (!nome || !cpf) {
        mostrarMensagem('Preencha os campos obrigatorios: Nome e CPF.', 'erro');
        return;
      }

      const body = {
        nome,
        cpf:             cpf.replace(/\D/g, ''),
        email:           document.getElementById('email').value.trim(),
        telefone:        document.getElementById('telefone').value.trim(),
        data_nascimento: document.getElementById('dataNascimento').value || null,
        endereco:        document.getElementById('endereco').value.trim(),
      };

      try {
        const res = await fetch(`${API}/pacientes`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        if (res.ok) {
          mostrarMensagem('Paciente cadastrado com sucesso! Redirecionando...', 'sucesso');
          setTimeout(() => window.location.href = '../pacientes.html', 1500);
        } else {
          const erro = await res.json();
          mostrarMensagem('Erro: ' + erro.erro, 'erro');
        }
      } catch (e) {
        mostrarMensagem('Erro ao conectar com o servidor.', 'erro');
      }
    }

    function mostrarMensagem(texto, tipo) {
      const el = document.getElementById('mensagem');
      el.textContent = texto;
      el.className = `mensagem ${tipo}`;
    }
  </script>
</body>
</html>
